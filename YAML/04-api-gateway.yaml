---
# 8. SERVICE - API GATEWAY (ENTRYPOINT API)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: comisiones
  labels:
    app: api-gateway
    uso: puerta_entrada_api
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

---
# 9. DEPLOYMENT - API GATEWAY
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: comisiones
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        encargado: dominio_crm
        api: SCC.Gateway.Management
    spec:
      containers:
        - name: api-gateway
          image: cfregistryvp01.corp.digitel.com.ve:444/api-gateway:1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            # --- SEGURIDAD PROTEGIDA (Inyectada desde el Secret unificado) ---
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: scc-db-secrets
                  key: scc_secret_key
            - name: ALGORITHM
              value: "HS256"

            # --- CONFIGURACIÓN DE BASE DE DATOS (Necesaria para tu startup de Python) ---
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: scc-db-secrets
                  key: pg_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scc-db-secrets
                  key: pg_pass
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: scc-config-global
                  key: POSTGRES_HOST
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: scc-config-global
                  key: POSTGRES_DB
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: scc-config-global
                  key: POSTGRES_PORT
            - name: DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: scc-config-global
                  key: DB_SCHEMA

            # --- MAPEO DE MICROSERVICIOS (DNS INTERNO K8S) ---
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8000"
            - name: BUSINESS_RULE_SERVICE_URL
              value: "http://business-rule-service:8000"
            - name: CALCULATION_SERVICE_URL
              value: "http://calculation-service:8000"
            - name: CLAIMS_SERVICE_URL
              value: "http://claims-service:8000"
            - name: DASHBOARD_SERVICE_URL
              value: "http://dashboard-service:8000"
            - name: REPORT_SERVICE_URL
              value: "http://report-service:8000"
            - name: ROL_SERVICE_URL
              value: "http://rol-service:8000"
            - name: USER_SERVICE_URL
              value: "http://user-service:8000"

            # --- PARÁMETROS GLOBALES ---
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: scc-config-global
                  key: TZ
            - name: http_proxy
              valueFrom:
                configMapKeyRef:
                  name: scc-config-global
                  key: http_proxy
            - name: https_proxy
              valueFrom:
                configMapKeyRef:
                  name: scc-config-global
                  key: https_proxy